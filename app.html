<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipPods — Upload & Extract Highlights</title>
    <link rel="stylesheet" href="app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="logo">ClipPods</a>
    </header>

    <main>
        <!-- Upload Section -->
        <section id="upload-section">
            <h2>Upload Podcast</h2>
            <div id="upload-area">
                <div class="input-group">
                    <label for="youtube-url" style="display:block; margin-bottom: 5px;">YouTube URL (Overrides file if both provided)</label>
                    <input type="url" id="youtube-url" placeholder="https://youtube.com/watch?v=..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                    <label for="file-input" style="display:block; margin-bottom: 5px;">Or Select Podcast File</label>
                    <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.mp4" style="display:block; width: 100%;">
                </div>
                
                <div class="options-group">
                    <div class="option">
                        <label for="source-lang">Podcast Language:</label>
                        <select id="source-lang">
                            <option value="ta-IN">Tamil</option>
                            <option value="hi-IN">Hindi</option>
                            <option value="en-IN">English (Indian)</option>
                            <option value="kn-IN">Kannada</option>
                            <option value="ml-IN">Malayalam</option>
                            <option value="te-IN">Telugu</option>
                        </select>
                    </div>
                    <div class="option">
                        <label for="target-lang">Translate to (Optional):</label>
                        <select id="target-lang">
                            <option value="">None</option>
                            <option value="ta-IN">Tamil</option>
                            <option value="hi-IN">Hindi</option>
                            <option value="en-IN">English</option>
                            <option value="ml-IN">Malayalam</option>
                        </select>
                    </div>
                </div>

                <button id="upload-btn" disabled>Upload & Process</button>
            </div>
            <p id="upload-status"></p>
        </section>

        <!-- Processing Status -->
        <section id="status-section" style="display: none;">
            <h2>Processing</h2>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <p id="status-text">Queued...</p>
        </section>

        <!-- Results / Clip Cards -->
        <section id="results-section" style="display: none;">
            <h2>Highlight Clips</h2>
            <div id="clips-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
